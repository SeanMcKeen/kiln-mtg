card: "Rootbound Crag"
faces:
  - abilities:
      # "This land enters tapped unless you control a Mountain or a Forest" (CR 614.1c).
      - replacement:
          event: { would_enter: { this: true } }
          condition: { not: { at_least: [{ count: { subtypes: [Mountain, Forest], controller: you } }, 1] } }
          instead: enters_tapped
      - activated: { cost: [tap], effect: { add_mana: { mana: { one_of: ["{R}", "{G}"] } } } }
