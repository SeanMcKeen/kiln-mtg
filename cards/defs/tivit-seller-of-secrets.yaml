      - keyword: flying
      - keyword: { ward: [{ mana: "{3}" }] }
      # Council's dilemma.
      - triggered:
          trigger:
            any_of:
              - { enters: { this: true } }
              - { deals_combat_damage_to_player: { this: true } }
