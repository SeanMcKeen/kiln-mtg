            vote:
              extra_vote: true
              choices:
                - { name: evidence, per_vote: { create_token: { token: { predefined: Clue }, count: 1, controller: you } } }
                - { name: bribery, per_vote: { create_token: { token: { predefined: Treasure }, count: 1, controller: you } } }
