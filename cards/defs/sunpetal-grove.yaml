card: "Sunpetal Grove"
faces:
  - abilities:
      # "This land enters tapped unless you control a Forest or a Plains" (CR 614.1c).
      - replacement:
          event: { would_enter: { this: true } }
          condition: { not: { at_least: [{ count: { subtypes: [Forest, Plains], controller: you } }, 1] } }
          instead: enters_tapped
      - activated: { cost: [tap], effect: { add_mana: { mana: { one_of: ["{G}", "{W}"] } } } }
