card: "Dragonskull Summit"
faces:
  - abilities:
      # "This land enters tapped unless you control an Swamp or a Mountain" (CR 614.1c).
      - replacement:
          event: { would_enter: { this: true } }
          condition: { not: { at_least: [{ count: { subtypes: [Swamp, Mountain], controller: you } }, 1] } }
          instead: enters_tapped
      - activated: { cost: [tap], effect: { add_mana: { mana: { one_of: ["{B}", "{R}"] } } } }
