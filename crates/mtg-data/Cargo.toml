[package]
name = "mtg-data"
description = "Card data ingestion: Scryfall bulk fetch, normalization, versioned binary card DB, name resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fetch"]
# Network access for `mtg data fetch`. Building from a local file needs no network.
fetch = ["dep:ureq"]

[dependencies]
mtg-cards.workspace = true
mtg-core.workspace = true
flate2.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
strsim.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
ureq = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
