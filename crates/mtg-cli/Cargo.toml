[package]
name = "mtg-cli"
description = "The `mtg` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mtg"
path = "src/main.rs"

[features]
default = ["fetch"]
fetch = ["mtg-data/fetch"]

[dependencies]
mtg-cards.workspace = true
mtg-core.workspace = true
mtg-data = { workspace = true, default-features = false }
mtg-sim.workspace = true
mtg-testkit.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
