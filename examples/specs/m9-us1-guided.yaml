# US-1 with guided search (M9 exit criterion): Kinnan searches, guided by its
# playbook, against the other test decks on greedy. 5,000 games should take
# under an hour on 8 cores.
# Run: kiln sim run examples/specs/m9-us1-guided.yaml --threads 2
spec: kiln-spec/1
name: m9-us1-guided
games: 5000
seed: 20261028
seating: balanced_rotation
open_decklists: true
decks:
  - { id: kinnan, source: { file: ../../tests/fixtures/decks/kinnan-verified.txt } }
  - { id: thrasios_tymna, source: { file: ../../tests/fixtures/decks/thrasios-tymna.txt } }
  - { id: najeela, source: { file: ../../tests/fixtures/decks/najeela.txt } }
  - { id: rograkh_silas, source: { file: ../../tests/fixtures/decks/rograkh-silas.txt } }
policies:
  default: { kind: greedy }
  kinnan:
    kind: search
    guide: { kind: playbook, playbook: ../playbooks/kinnan.rhai, fallback: { kind: greedy } }
