# A/B: swap one card in Najeela and compare on the same seeds (common random numbers).
# Run: kiln sim run examples/specs/m6-ab.yaml --threads 2
spec: kiln-spec/1
name: m6-ab
mode: ab
games: 400
seed: 5
decks:
  - { id: kinnan, source: { file: ../../tests/fixtures/decks/kinnan-verified.txt } }
  - { id: thrasios_tymna, source: { file: ../../tests/fixtures/decks/thrasios-tymna.txt } }
  - { id: najeela, source: { file: ../../tests/fixtures/decks/najeela.txt } }
  - { id: rograkh_silas, source: { file: ../../tests/fixtures/decks/rograkh-silas.txt } }
variants:
  najeela_sol_ring: { base: najeela, swap: { out: [Abrupt Decay], in: [Sol Ring] } }
policies:
  default: { kind: greedy }
