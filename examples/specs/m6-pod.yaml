# The four M6 test decks in a cEDH-style pod (US-1 shape), greedy pilots.
# Run: kiln sim run examples/specs/m6-pod.yaml --threads 2
spec: kiln-spec/1
name: m6-pod
games: 400
seed: 20261027
seating: balanced_rotation
decks:
  - { id: kinnan, source: { file: ../../tests/fixtures/decks/kinnan-verified.txt } }
  - { id: thrasios_tymna, source: { file: ../../tests/fixtures/decks/thrasios-tymna.txt } }
  - { id: najeela, source: { file: ../../tests/fixtures/decks/najeela.txt } }
  - { id: rograkh_silas, source: { file: ../../tests/fixtures/decks/rograkh-silas.txt } }
policies:
  default: { kind: greedy }
limits:
  max_turns: 100
metrics:
  decision_stats: true
  per_card: { decks: [kinnan], min_samples: 50 }
  interaction: true
  mana: true
