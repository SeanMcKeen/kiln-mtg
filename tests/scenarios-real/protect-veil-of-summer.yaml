scenario: kiln-scenario/1
name: "Veil of Summer: draw after an opponent's blue spell; your spells can't be countered and you have hexproof from blue and black this turn"
cr: ["702.11d", "101.2", "611.2c"]
verifies: [Veil of Summer]
players:
  - battlefield: [Forest, Mountain]
    hand: [Veil of Summer, Lightning Bolt]
    library: [Opt, Swamp]
  - battlefield: [Island, Island, Island]
    hand: [Opt, Counterspell]
script:
  - pass: 1
  - { player: P2, choose: Cast Opt }
  - { player: P2, choose: Pay with Island }
  - pass_all
  - { player: P2, choose: Put on bottom Test Wastes }
  - choose: Cast Veil of Summer
  - choose: Pay with Forest
  - pass_all
  - check:
      zones: { P1.hand: [Lightning Bolt, Opt] }
  - choose: Cast Lightning Bolt
  - choose: Target P2
  - choose: Pay with Mountain
  - pass: 1
  - { player: P2, choose: Cast Counterspell }
  - { player: P2, choose: Target Lightning Bolt }
  - { player: P2, choose: "Pay with Island, Island" }
  - pass_all
  - pass_all
expect:
  life: { P2: 17 }
  zones: { P2.graveyard: [Opt, Counterspell] }
