scenario: kiln-scenario/1
name: "Drowned Catacomb enters untapped with a Swamp and taps for either color"
cr: ["614.1c", "305.6"]
verifies: ["Drowned Catacomb"]
players:
  - battlefield: [Swamp]
    hand: ["Drowned Catacomb"]
  - {}
turn: { number: 3, active: P1, step: precombat_main }
script:
  - choose: "Play Drowned Catacomb"
  - check:
      tapped: { "Drowned Catacomb": false }
  - choose: "Tap Drowned Catacomb for mana"
  - check:
      decision: { player: P1, kind: choose_mana, options_include: ["Add {U}", "Add {B}"] }
  - choose: "Add {B}"
expect:
  pool: { P1: "{B}" }
