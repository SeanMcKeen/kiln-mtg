scenario: kiln-scenario/1
name: "Dragonskull Summit enters untapped with a Mountain and taps for either color"
cr: ["614.1c", "305.6"]
verifies: ["Dragonskull Summit"]
players:
  - battlefield: [Mountain]
    hand: ["Dragonskull Summit"]
  - {}
turn: { number: 3, active: P1, step: precombat_main }
script:
  - choose: "Play Dragonskull Summit"
  - check:
      tapped: { "Dragonskull Summit": false }
  - choose: "Tap Dragonskull Summit for mana"
  - check:
      decision: { player: P1, kind: choose_mana, options_include: ["Add {B}", "Add {R}"] }
  - choose: "Add {R}"
expect:
  pool: { P1: "{R}" }
