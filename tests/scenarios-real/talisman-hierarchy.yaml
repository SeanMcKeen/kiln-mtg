scenario: kiln-scenario/1
name: "Talisman of Hierarchy: {C} for free, or {W} or {B} for 1 damage"
cr: ["605.3a", "605.3b", "120.3"]
verifies: [Talisman of Hierarchy]
players:
  - battlefield: [Talisman of Hierarchy]
  - {}
script:
  - check:
      decision: { player: P1, kind: priority, options_include: ["Tap Talisman of Hierarchy for {C}", Tap Talisman of Hierarchy for mana] }
  - choose: Tap Talisman of Hierarchy for mana
  - check:
      decision: { player: P1, kind: choose_mana, options: ["Add {W}", "Add {B}"] }
  - choose: "Add {B}"
expect:
  pool: { P1: "{B}" }
  life: { P1: 19 }
