  - check:
      counters: { Walking Ballista: { +1/+1: 2 } }
      pt: { Walking Ballista: [2, 2] }
  - choose: "Activate Heliod, Sun-Crowned ability 4"
  - choose: Target Walking Ballista (P1)
  - choose: Pay with Plains, Plains
  - pass_all
  - choose: Activate Walking Ballista ability 3
  - choose: Target P2
  - pass_all
  - choose: Target Walking Ballista (P1)
  - pass_all
  - choose: Activate Walking Ballista ability 3
  - choose: Target P2
  - pass_all
  - choose: Target Walking Ballista (P1)
  - pass_all
  - choose: Activate Walking Ballista ability 3
  - choose: Target P2
  - pass_all
  - choose: Target Walking Ballista (P1)
  - pass_all
  # The same state, with P2 three life lower and P1 three higher: a loop.
  - check:
      life: { P2: 37, P1: 23 }
      decision:
        player: P1
        kind: propose_shortcut
        options: ["Don't take a shortcut", Repeat the loop 10 times, Repeat the loop 37 times]
