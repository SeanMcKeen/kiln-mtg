scenario: mtg-scenario/1
name: "Mana Drain: the delayed trigger adds {C} equal to the countered spell's mana value at its controller's next main phase"
cr: ["603.7a", "603.7c", "608.2h", "701.6a"]
verifies: [Mana Drain]
players:
  - battlefield: [Island, Island]
    hand: [Mana Drain]
  - battlefield: [Forest, Forest, Forest]
    hand: [Beast Within]
turn: { number: 2, active: P1, step: upkeep }
script:
  - pass: 1
  - choose: Cast Beast Within
    player: P2
  - choose: Target Island (P1)
  - choose: Pay with Forest, Forest, Forest
  - pass: 1
  - choose: Cast Mana Drain
  - choose: Target Beast Within
  - choose: Pay with Island, Island
  - pass_all
  - check:
      zones: { P2.graveyard: [Beast Within], P1.graveyard: [Mana Drain] }
      pool: { P1: "" }
  # Upkeep ends; draw step; then the precombat main phase begins and the trigger fires.
  - pass_all
  - pass_all
  - check:
      step: precombat_main
      decision: { player: P1, kind: priority }
  - pass_all
expect:
  pool: { P1: "{C}{C}{C}" }
  zones:
    P1.battlefield: [Island, Island]
