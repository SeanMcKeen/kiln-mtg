scenario: kiln-scenario/1
name: "Talisman of Curiosity: {C} for free, or {G} or {U} for 1 damage"
cr: ["605.3a", "605.3b", "120.3"]
verifies: [Talisman of Curiosity]
players:
  - battlefield: [Talisman of Curiosity]
  - {}
script:
  - check:
      decision: { player: P1, kind: priority, options_include: ["Tap Talisman of Curiosity for {C}", Tap Talisman of Curiosity for mana] }
  - choose: Tap Talisman of Curiosity for mana
  - check:
      decision: { player: P1, kind: choose_mana, options: ["Add {U}", "Add {G}"] }
  - choose: "Add {U}"
expect:
  pool: { P1: "{U}" }
  life: { P1: 19 }
