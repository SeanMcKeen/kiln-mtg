scenario: mtg-scenario/1
name: "Thrasios: scry 1, then reveal the top card; a land is put onto the battlefield tapped"
cr: ["701.22a", "701.20a", "110.5b"]
verifies: ["Thrasios, Triton Hero"]
players:
  - battlefield: [Island, Island, Forest, Forest]
    commanders: [{ card: "Thrasios, Triton Hero", zone: battlefield }]
    library: [Swamp, Opt, Mountain]
