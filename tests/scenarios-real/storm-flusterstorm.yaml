scenario: mtg-scenario/1
name: "Flusterstorm counters an instant unless its controller pays {1}; storm copies it"
cr: ["702.40a", "118.12", "701.6a"]
verifies: [Flusterstorm]
players:
  - battlefield: [Island]
    hand: [Flusterstorm]
  - battlefield: [Mountain]
    hand: [Lightning Bolt]
turn: { number: 3, active: P2, step: precombat_main }
script:
  - { player: P2, choose: Cast Lightning Bolt }
  - { player: P2, choose: Target P1 }
