verifies: ["Thalia, Guardian of Thraben"]
players:
  - battlefield: [Mountain, Mountain]
    hand: [Lightning Bolt]
  - battlefield: ["Thalia, Guardian of Thraben", Island]
    hand: [Force of Will, Brainstorm]
script:
