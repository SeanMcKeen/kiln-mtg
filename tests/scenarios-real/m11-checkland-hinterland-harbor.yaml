scenario: kiln-scenario/1
name: "Hinterland Harbor enters untapped with a Forest and taps for either color"
cr: ["614.1c", "305.6"]
verifies: ["Hinterland Harbor"]
players:
  - battlefield: [Forest]
    hand: ["Hinterland Harbor"]
  - {}
turn: { number: 3, active: P1, step: precombat_main }
script:
  - choose: "Play Hinterland Harbor"
  - check:
      tapped: { "Hinterland Harbor": false }
  - choose: "Tap Hinterland Harbor for mana"
  - check:
      decision: { player: P1, kind: choose_mana, options_include: ["Add {G}", "Add {U}"] }
  - choose: "Add {U}"
expect:
  pool: { P1: "{U}" }
