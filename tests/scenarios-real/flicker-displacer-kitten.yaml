scenario: mtg-scenario/1
name: "Displacer Kitten: casting a noncreature spell flickers a nonland permanent you control (it untaps as a new object)"
cr: ["400.7", "603.2", "601.2c"]
verifies: [Displacer Kitten]
players:
  - battlefield: [Displacer Kitten, Island, Basalt Monolith]
    hand: [Opt]
    library: [Island, Swamp]
  - {}
script:
  - choose: Tap Basalt Monolith for {C}{C}{C}
  - choose: Cast Opt
  - choose: Pay with Island
  - choose: Target Basalt Monolith (P1)
  - pass_all
  - check:
      tapped: { Basalt Monolith: false }
  - pass_all
  - choose: Stop
expect:
  tapped: { Basalt Monolith: false }
  pool: { P1: "{C}{C}{C}" }
  zones: { P1.hand: [Island] }
