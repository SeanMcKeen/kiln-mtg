scenario: kiln-scenario/1
name: "Glacial Fortress enters untapped with a Island and taps for either color"
cr: ["614.1c", "305.6"]
verifies: ["Glacial Fortress"]
players:
  - battlefield: [Island]
    hand: ["Glacial Fortress"]
  - {}
turn: { number: 3, active: P1, step: precombat_main }
script:
  - choose: "Play Glacial Fortress"
  - check:
      tapped: { "Glacial Fortress": false }
  - choose: "Tap Glacial Fortress for mana"
  - check:
      decision: { player: P1, kind: choose_mana, options_include: ["Add {W}", "Add {U}"] }
  - choose: "Add {U}"
expect:
  pool: { P1: "{U}" }
