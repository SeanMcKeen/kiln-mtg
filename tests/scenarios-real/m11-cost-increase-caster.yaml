verifies: [Grand Arbiter Augustin IV]
players:
  - battlefield: ["Ragavan, Nimble Pilferer"]
  - battlefield: [Grand Arbiter Augustin IV]
    library: [Gut Shot, Island]
turn: { number: 3, active: P1, step: declare_attackers }
script:
