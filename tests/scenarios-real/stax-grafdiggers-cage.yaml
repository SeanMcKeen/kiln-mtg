  zones:
    P1.graveyard: [Brain Freeze, Opt, Ponder, Preordain, Grizzly Bears]
    P1.battlefield: ["Grafdigger's Cage", Underworld Breach, Island, Island, Swamp, Swamp, Animate Dead]
