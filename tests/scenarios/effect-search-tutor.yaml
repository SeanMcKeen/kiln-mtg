scenario: kiln-scenario/1
name: Searching for "a card" must find one if possible; the library is then shuffled
cr: ["701.23a", "701.23d", "701.24a"]
players:
  - battlefield: [Test Swamp, Test Swamp]
    hand: [Test Tutor]
    library: [Test Bolt, Test Bear, Test Ogre]
  - {}
script:
  - choose: Cast Test Tutor
  - choose: Pay with Test Swamp, Test Swamp
  - pass_all
  - check:
      decision:
        player: P1
        kind: choose_card
        # No "Stop": a search for a quantity of cards must find them (CR 701.23d).
        options: [Find Test Bolt, Find Test Bear, Find Test Ogre]
  - choose: Find Test Ogre
expect:
  zones:
    P1.hand: [Test Ogre]
    P1.library: [Test Bolt, Test Bear]
    P1.graveyard: [Test Tutor]
  decision: { player: P1, kind: priority }
