scenario: kiln-scenario/1
name: Treasure tokens make mana; a sacrificed token ceases to exist
cr: ["111.10a", "111.2", "704.5d", "605.3b"]
players:
  - battlefield: [Test Mountain, Test Wastes]
    hand: [Test Treasure Maker, Test Bolt]
  - {}
script:
  - choose: Cast Test Treasure Maker
  - choose: Pay with Test Mountain, Test Wastes
  - pass_all
  - check:
      zones:
        P1.battlefield: [Test Mountain, Test Wastes, Treasure, Treasure]
  - choose: Activate Treasure for mana
  - choose: "Add {R}"
  - choose: Cast Test Bolt
  - choose: Target P2
  - choose: Pay with 1 from pool
  - pass_all
expect:
  life: { P2: 17 }
  zones:
    P1.battlefield: [Test Mountain, Test Wastes, Treasure]
    # The sacrificed Treasure ceased to exist in the graveyard (CR 704.5d).
    P1.graveyard: [Test Treasure Maker, Test Bolt]
