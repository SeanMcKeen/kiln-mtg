scenario: kiln-scenario/1
name: "A commander left in the graveyard isn't offered again at the next check"
cr: ["903.9a"]
players:
  - battlefield: [Test Plains, Test Plains, Test Plains, Test Plains]
    hand: [Test Reckoning]
    commanders: [{ card: Test Commander, zone: battlefield }]
  - {}
script:
  - choose: Cast Test Reckoning
  - choose: Pay with Test Plains, Test Plains, Test Plains, Test Plains
  - pass_all
  - choose: Leave Test Commander in graveyard
  - check:
      decision: { player: P1, kind: priority }
expect:
  zones:
    command: []
    P1.graveyard: [Test Reckoning, Test Commander]
