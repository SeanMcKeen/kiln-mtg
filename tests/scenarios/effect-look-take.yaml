scenario: mtg-scenario/1
name: Look at the top cards, take up to one creature, the rest go to the bottom in a random order
cr: ["701.20e", "608.2d"]
players:
  - battlefield: [Test Island, Test Wastes, Test Wastes]
    hand: [Test Seer]
    library: [Test Bolt, Test Bear, Test Ogre, Test Wall, Test Golem]
  - {}
script:
  - choose: Cast Test Seer
  - choose: Pay with Test Island, Test Wastes, Test Wastes
  - pass_all
  - check:
      decision: { player: P1, kind: choose_card, options: [Stop, Take Test Bear, Take Test Ogre, Take Test Wall] }
  - choose: Take Test Ogre
expect:
  zones:
    P1.hand: [Test Ogre]
    P1.library: [Test Bolt, Test Bear, Test Wall, Test Golem]
  library_top:
    P1: [Test Golem]
