scenario: kiln-scenario/1
name: Mana of any color is chosen as the effect adds it
cr: ["106.1b", "106.4"]
players:
  - battlefield: [Test Wastes]
    hand: [Test Prism, Test Bolt]
  - {}
script:
  - choose: Cast Test Prism
  - choose: Pay with Test Wastes
  - pass_all
  - check:
      decision:
        player: P1
        kind: choose_mana
        options: ["Add {W}", "Add {U}", "Add {B}", "Add {R}", "Add {G}"]
  - choose: "Add {R}"
  - choose: Cast Test Bolt
  - choose: Target P2
  - choose: Pay with 1 from pool
  - pass_all
expect:
  life: { P2: 17 }
