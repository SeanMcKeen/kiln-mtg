scenario: kiln-scenario/1
name: Choose a card name, then reveal until a card with that name
cr: ["201.4", "701.20a", "608.2d"]
players:
  - battlefield: [Test Swamp]
    hand: [Test Consult]
    library: [Test Bolt, Test Bear, Test Ogre, Test Wall, Test Golem]
  - {}
script:
  - choose: Cast Test Consult
  - choose: Pay with Test Swamp
  - pass_all
  - check:
      decision: { player: P1, kind: choose_name, options_include: [Name Test Wall, Name a card not in this game] }
  - choose: Name Test Wall
expect:
  zones:
    P1.hand: [Test Wall]
    exile: [Test Bolt, Test Bear, Test Ogre]
    P1.library: [Test Golem]
