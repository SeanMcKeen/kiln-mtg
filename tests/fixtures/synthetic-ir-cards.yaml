# Made-up cards (not real Magic cards) that exercise the M3 effect
# interpreter. Each one covers one interpreter path; CR-cited scenarios in
# tests/scenarios/ use them. Loaded by `CardPool::m3_test_set`, appended after
# the frozen M2 test set.

- name: Test Tutor
  cost: "{1}{B}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          seq:
            - search: { who: you, filter: {}, count: 1, to: hand, reveal: false }
            - shuffle: you

- name: Test Land Seeker
  cost: "{G}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          seq:
            - search: { who: you, filter: { types: [land], supertypes: [basic] }, count: 1, to: battlefield, reveal: true }
            - shuffle: you

- name: Test Seal
  cost: "{B}"
  types: Sorcery
  abilities:
    - spell:
        effect: { search: { who: you, filter: {}, count: 1, to: top_of_library, reveal: false } }

- name: Test Scry
  cost: "{U}"
  types: Instant
  abilities:
    - spell:
        effect:
          seq:
            - scry: { who: you, amount: 2 }
            - draw: { who: you, amount: 1 }

- name: Test Ponder
  cost: "{U}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          seq:
            - look_at_top: { who: you, count: 3, rest: top_any_order }
            - may: { shuffle: you }
            - draw: { who: you, amount: 1 }

- name: Test Brainstorm
  cost: "{U}"
  types: Instant
  abilities:
    - spell:
        effect:
          seq:
            - draw: { who: you, amount: 3 }
            - move_cards: { who: you, from: hand, count: 2, to: top_of_library }

- name: Test Windfall
  cost: "{2}{U}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          seq:
            - for_each_player: { players: any, effect: { discard: { who: each, what: hand } } }
            - for_each_player: { players: any, effect: { draw: { who: each, amount: most_discarded_this_way } } }

- name: Test Exile
  cost: "{W}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect:
          seq:
            - exile: { what: { one: { target: 0 } } }
            - gain_life: { who: { controller_of: { target: 0 } }, amount: { power_of: { target: 0 } } }

- name: Test Ritual
  cost: "{B}"
  types: Instant
  abilities:
    - spell:
        effect: { add_mana: { mana: { fixed: "{B}{B}{B}" } } }

- name: Test Prism
  cost: "{1}"
  types: Instant
  abilities:
    - spell:
        effect: { add_mana: { mana: { any_color: 1 } } }

- name: Test Tax
  cost: "{1}{U}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { player: any } }]
        effect:
          unless:
            payer: { target: 0 }
            cost: [{ mana: "{2}" }]
            effect: { lose_life: { who: { target: 0 }, amount: 3 } }

- name: Test Consult
  cost: "{B}"
  types: Instant
  abilities:
    - spell:
        effect:
          seq:
            - choose: { what: card_name, store: name }
            - exile: { what: { top_of_library: { owner: you, count: 2 } } }
            - reveal_until: { who: you, filter: { named: name }, found_to: hand, rest_to: exile }

- name: Test Gamble
  cost: "{R}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          seq:
            - search: { who: you, filter: {}, count: 1, to: hand, reveal: false }
            - discard: { who: you, what: { random: 1 } }
            - shuffle: you

- name: Test Growth
  cost: "{G}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect: { pump: { what: { one: { target: 0 } }, power: 3, toughness: 3 } }

- name: Test Purge
  cost: "{2}{B}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          for_each_player:
            players: any
            effect:
              sacrifice:
                who: each
                what: { chosen_from: { who: each, zone: battlefield, filter: { types: [creature] }, count: 1 } }

- name: Test Mind Rot
  cost: "{2}{B}"
  types: Sorcery
  abilities:
    - spell:
        targets: [{ what: { player: any } }]
        effect: { discard: { who: { target: 0 }, what: { chosen: { count: 2 } } } }

- name: Test Ascension
  cost: "{5}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          if:
            condition: { at_least: [{ count: { types: [creature], controller: you } }, 3] }
            then: { win_game: you }

- name: Test Reckoning
  cost: "{2}{W}{W}"
  types: Sorcery
  abilities:
    - spell:
        effect: { destroy: { all: { types: [creature] } } }

- name: Test Bounce
  cost: "{1}{U}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect: { move: { what: { one: { target: 0 } }, to: hand } }

- name: Test Bargain
  cost: "{B}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          if_does:
            who: you
            action: { discard: { who: you, what: { chosen: { count: 1 } } } }
            then: { draw: { who: you, amount: 2 } }

- name: Test Seer
  cost: "{2}{U}"
  types: Sorcery
  abilities:
    - spell:
        effect:
          look_at_top:
            who: you
            count: 4
            take: { filter: { types: [creature] }, up_to: 1, to: hand }
            rest: bottom_random

- name: Test Sign
  cost: "{B}{B}"
  types: Sorcery
  abilities:
    - spell:
        targets: [{ what: { player: any } }]
        effect:
          seq:
            - draw: { who: { target: 0 }, amount: 2 }
            - lose_life: { who: { target: 0 }, amount: 2 }

# ---- casting (M3 B3) and keywords (M3 B5) ------------------------------------

- name: Test Charm
  cost: "{R}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: any }]
        effect:
          modal:
            min: 1
            max: 1
            modes:
              - deal_damage: { to: { target: 0 }, amount: 2 }
              - draw: { who: you, amount: 1 }

- name: Test Command
  cost: "{2}{B}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }, { what: { player: any } }]
        effect:
          modal:
            min: 2
            max: 2
            modes:
              - destroy: { one: { target: 0 } }
              - draw: { who: { target: 1 }, amount: 2 }
              - gain_life: { who: you, amount: 3 }

- name: Test Counterspell
  cost: "{U}{U}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { spell: {} } }]
        effect: { counter: { one: { target: 0 } } }

- name: Test Pierce
  cost: "{U}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { spell: { not_types: [creature] } } }]
        effect:
          unless:
            payer: { controller_of: { target: 0 } }
            cost: [{ mana: "{2}" }]
            effect: { counter: { one: { target: 0 } } }

- name: Test Will
  cost: "{3}{U}{U}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { spell: {} } }]
        alternative_costs: [{ cost: [{ pay_life: 1 }, { exile_from_hand: { color: U } }] }]
        effect: { counter: { one: { target: 0 } } }

- name: Test Probe
  cost: "{U/P}"
  types: Sorcery
  abilities:
    - spell:
        effect: { draw: { who: you, amount: 1 } }

- name: Test Flare
  cost: "{R/G}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: any }]
        effect: { deal_damage: { to: { target: 0 }, amount: 2 } }

- name: Test Fireball
  cost: "{X}{R}"
  types: Sorcery
  abilities:
    - spell:
        targets: [{ what: any }]
        effect: { deal_damage: { to: { target: 0 }, amount: x } }

- name: Test Offering
  cost: "{1}{B}"
  types: Sorcery
  abilities:
    - spell:
        additional_costs:
          - sacrifice: { chosen_from: { who: you, zone: battlefield, filter: { types: [creature] }, count: 1 } }
        effect: { draw: { who: you, amount: 3 } }

- name: Test Volley
  cost: "{1}{R}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } }, up_to: 2 }]
        effect: { deal_damage: { to: { target: 0 }, amount: 1 } }

- name: Test Decay
  cost: "{B}{G}"
  types: Instant
  abilities:
    - static: { effect: { rule: cant_be_countered } }
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect: { destroy: { one: { target: 0 } } }

- name: Test Hexproof Bear
  cost: "{1}{G}"
  types: Creature — Bear
  pt: [2, 2]
  abilities: [{ keyword: hexproof }]

- name: Test Shroud Bear
  cost: "{1}{G}"
  types: Creature — Bear
  pt: [2, 2]
  abilities: [{ keyword: shroud }]

- name: Test Flash Bear
  cost: "{1}{G}"
  types: Creature — Bear
  pt: [2, 2]
  abilities: [{ keyword: flash }]

- name: Test Guardian
  cost: "{3}"
  types: Artifact Creature — Golem
  pt: [1, 1]
  abilities: [{ keyword: indestructible }]

# ---- activated and mana abilities (M3 B4) ------------------------------------

- name: Test Rock
  cost: "{1}"
  types: Artifact
  abilities:
    - activated: { cost: [tap], effect: { add_mana: { mana: { fixed: "{C}{C}" } } } }

- name: Test Prism Bird
  cost: "{G}"
  types: Creature — Bird
  pt: [0, 1]
  abilities:
    - keyword: flying
    - activated: { cost: [tap], effect: { add_mana: { mana: { any_color: 1 } } } }

- name: Test Petal
  cost: "{0}"
  types: Artifact
  abilities:
    - activated: { cost: [tap, { sacrifice: { one: this } }], effect: { add_mana: { mana: { any_color: 1 } } } }

- name: Test Tomb
  types: Land
  abilities:
    - activated:
        cost: [tap]
        effect:
          seq:
            - add_mana: { mana: { fixed: "{C}{C}" } }
            - deal_damage: { to: { player: you }, amount: 2 }

- name: Test Confluence
  types: Land
  abilities:
    - activated: { cost: [tap, { pay_life: 1 }], effect: { add_mana: { mana: { any_color: 1 } } } }

- name: Test Signet
  cost: "{2}"
  types: Artifact
  abilities:
    - activated: { cost: [{ mana: "{1}" }, tap], effect: { add_mana: { mana: { fixed: "{W}{U}" } } } }

- name: Test Fetch
  types: Land
  abilities:
    - activated:
        cost: [tap, { pay_life: 1 }, { sacrifice: { one: this } }]
        effect:
          seq:
            - search: { who: you, filter: { types: [land], subtypes: [Forest, Island] }, count: 1, to: battlefield, reveal: false }
            - shuffle: you

- name: Test Pinger
  cost: "{1}{R}"
  types: Creature — Goblin
  pt: [1, 1]
  abilities:
    - activated: { cost: [tap], targets: [{ what: any }], effect: { deal_damage: { to: { target: 0 }, amount: 1 } } }

- name: Test Totem
  cost: "{1}"
  types: Artifact
  abilities:
    - activated: { cost: [{ mana: "{2}" }], timing: sorcery, effect: { draw: { who: you, amount: 1 } } }
    - activated: { cost: [{ mana: "{1}" }], once_per_turn: true, effect: { gain_life: { who: you, amount: 1 } } }

# ---- counters and tokens (M3 B6) ---------------------------------------------

- name: Test Treasure Maker
  cost: "{1}{R}"
  types: Sorcery
  abilities:
    - spell:
        effect: { create_token: { token: { predefined: Treasure }, count: 2, controller: you } }

- name: Test Clue Maker
  cost: "{U}"
  types: Instant
  abilities:
    - spell:
        effect: { create_token: { token: { predefined: Clue }, count: 1, controller: you } }

- name: Test Beast Gift
  cost: "{G}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [artifact] } } }]
        effect:
          seq:
            - destroy: { one: { target: 0 } }
            - create_token:
                token: { creature: { power: 3, toughness: 3, colors: G, subtypes: [Beast] } }
                count: 1
                controller: { controller_of: { target: 0 } }

- name: Test Growth Counter
  cost: "{G}"
  types: Sorcery
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect: { put_counters: { what: { one: { target: 0 } }, counter: "+1/+1", amount: 2 } }

- name: Test Wither
  cost: "{B}"
  types: Instant
  abilities:
    - spell:
        targets: [{ what: { object: { types: [creature] } } }]
        effect: { put_counters: { what: { one: { target: 0 } }, counter: "-1/-1", amount: 2 } }

- name: Test Battery
  cost: "{1}"
  types: Artifact
  abilities:
    - activated: { cost: [tap], effect: { put_counters: { what: { one: this }, counter: charge, amount: 1 } } }
    - activated: { cost: [{ remove_counters: { counter: charge, amount: 1 } }], effect: { gain_life: { who: you, amount: 2 } } }

# ---- plain objects for searches (M3 B8) --------------------------------------

- name: Test Enchantment
  cost: "{1}{W}"
  types: Enchantment

- name: Test Blade
  cost: "{1}"
  types: Artifact — Equipment
